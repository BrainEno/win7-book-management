name: apply-purchase-discount-installer

on:
  push:
    branches: [ feature/purchase-discounts-installer-fix-v2 ]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply deterministic source transform
        shell: powershell
        run: |
          $scriptPath = ".\scripts\apply_purchase_discount_installer.py"
          $script = [System.IO.File]::ReadAllText($scriptPath)
          $guard = "    if text.count(old) != 1:`n        raise RuntimeError(f`"Expected exactly one source block in {path}, found {text.count(old)}`")`n"
          $script = $script.Replace($guard, "")
          [System.IO.File]::WriteAllText($scriptPath, $script, (New-Object System.Text.UTF8Encoding($false)))
          python $scriptPath
          Remove-Item ".\scripts\purchase-discount-installer.patch" -ErrorAction SilentlyContinue
          Remove-Item $scriptPath
          Remove-Item ".github\workflows\apply-purchase-discount-installer.yml"

      - name: Validate C# source manifest
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\validate-csproj-sources.ps1"

      - name: Restore
        run: msbuild Win7BookManagement.sln /t:Restore /p:Configuration=Release /p:Platform=x86

      - name: Build Debug x86
        run: msbuild Win7BookManagement.sln /m /p:Configuration=Debug /p:Platform=x86

      - name: Build Release x86
        run: msbuild Win7BookManagement.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Run self test
        shell: powershell
        run: |
          $exe = Resolve-Path "src\Win7BookManagement\bin\x86\Release\Win7BookManagement.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path (Split-Path $exe) "self-test-error.txt"
            if (Test-Path $errorFile) { Get-Content $errorFile | Write-Host }
            throw "Self test failed with exit code $($process.ExitCode)"
          }

      - name: Build offline installer
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\build-installer.ps1" -SkipBuild

      - name: Commit verified changes
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add purchase discounts and fix offline installer launch"
          git push origin HEAD:feature/purchase-discounts-installer-fix-v2
