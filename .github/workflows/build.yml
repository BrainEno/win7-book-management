name: build-win7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Win7BookManagement.sln /t:Restore /p:Configuration=Release /p:Platform=x86

      - name: Build
        run: msbuild Win7BookManagement.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Run self test
        shell: powershell
        run: |
          $exe = Resolve-Path "src\Win7BookManagement\bin\x86\Release\Win7BookManagement.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path (Split-Path $exe) "self-test-error.txt"
            if (Test-Path $errorFile) {
              Write-Host "Self-test diagnostics:"
              Get-Content $errorFile | Write-Host
            }
            throw "Self test failed with exit code $($process.ExitCode)"
          }

      - name: Build offline installer
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\build-installer.ps1" -SkipBuild

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: win7-book-management-x86
          path: src/Win7BookManagement/bin/x86/Release/
          if-no-files-found: error

      - name: Upload offline installer
        uses: actions/upload-artifact@v4
        with:
          name: win7-book-management-offline-installer
          path: installer/output/Win7BookManagement-Offline-Setup.exe
          if-no-files-found: error
