name: build-win7

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Validate source manifests and supply-chain guards
        shell: powershell
        run: |
          .\scripts\validate-csproj-sources.ps1
          .\scripts\test-build-guards.ps1

      - name: Restore
        shell: powershell
        run: |
          msbuild Win7BookManagement.sln /t:Restore /p:Configuration=Release /p:Platform=x86 /v:minimal 2>&1 | Tee-Object -Variable restoreOutput
          if ($LASTEXITCODE -ne 0) {
            $restoreOutput | Select-Object -Last 30 | ForEach-Object { Write-Host "::error::Restore: $_" }
            exit 1
          }
      - name: Build Debug x86
        shell: powershell
        run: |
          msbuild Win7BookManagement.sln /m /p:Configuration=Debug /p:Platform=x86 /v:minimal 2>&1 | Tee-Object -Variable buildOutput
          if ($LASTEXITCODE -ne 0) {
            $buildOutput | Select-String -Pattern ': error ' | Select-Object -First 30 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
      - name: Build Release x86
        shell: powershell
        run: |
          msbuild Win7BookManagement.sln /m /p:Configuration=Release /p:Platform=x86 /v:minimal 2>&1 | Tee-Object -Variable buildOutput
          if ($LASTEXITCODE -ne 0) {
            $buildOutput | Select-String -Pattern ': error ' | Select-Object -First 30 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }

      - name: Focused unit tests (net48/x86)
        shell: powershell
        run: |
          dotnet test tests/Win7BookManagement.Tests/Win7BookManagement.Tests.csproj -c Release -p:Platform=x86 --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults 2>&1 | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) {
            $testOutput | Select-Object -Last 80 | ForEach-Object { Write-Host "::error::Test: $_" }
            exit 1
          }
      - name: Release-folder smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src\Win7BookManagement\bin\x86\Release"
          try {
            $p = Start-Process "$dir\Win7BookManagement.exe" "--self-test" -Wait -PassThru -RedirectStandardOutput smoke-stdout.txt -RedirectStandardError smoke-stderr.txt
          } catch {
            Write-Host "::error::Smoke launch failed: $_"
            Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "::error::Release file: $($_.Name)" }
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Get-Content "$dir\smoke-error.txt" -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { Write-Host "::error::Smoke: $_" }
            Get-Content smoke-stderr.txt -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { Write-Host "::error::Smoke: $_" }
            Get-Content "$dir\startup-error.txt" -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { Write-Host "::error::Startup: $_" }
            Write-Host "::error::Smoke exit code: $($p.ExitCode)"
            exit 1
          }
      - name: Full business and UI regression suite (not shipped)
        timeout-minutes: 10
        shell: powershell
        run: |
          $exe = "tools\Win7BookManagement.UiTools\bin\x86\Release\Win7BookManagement.UiTools.exe"
          $p = Start-Process $exe "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "tools\Win7BookManagement.UiTools\bin\x86\Release\selftest-error.txt" -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { Write-Host "::error::SelfTest: $_" }
            throw "Full self-test failed: $($p.ExitCode)"
          }
          New-Item -ItemType Directory -Force ui-snapshots | Out-Null
          $p = Start-Process $exe -ArgumentList @("--ui-snapshots", (Join-Path $PWD "ui-snapshots")) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "tools\Win7BookManagement.UiTools\bin\x86\Release\ui-snapshot-error.txt" -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { Write-Host "::error::Snapshots: $_" }
            throw "UI snapshots failed: $($p.ExitCode)"
          }

      - name: Build offline installer (hash-pinned prerequisites; optional signing)
        shell: powershell
        env:
          BOOKDESK_SIGNING_CERT: ${{ secrets.BOOKDESK_SIGNING_CERT }}
          BOOKDESK_SIGNING_PASSWORD: ${{ secrets.BOOKDESK_SIGNING_PASSWORD }}
        run: |
          $arguments = @{ SkipBuild = $true }
          if ($env:BOOKDESK_SIGNING_CERT) {
            $certificate = Join-Path $env:RUNNER_TEMP "bookdesk-signing.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:BOOKDESK_SIGNING_CERT))
            $arguments.SignCertificatePath = $certificate
            $arguments.SignCertificatePassword = $env:BOOKDESK_SIGNING_PASSWORD
          }
          try { .\scripts\build-installer.ps1 @arguments }
          finally { if ($certificate -and (Test-Path $certificate)) { Remove-Item $certificate -Force } }

      - uses: actions/upload-artifact@v4
        with:
          name: win7-book-management-x86
          path: src/Win7BookManagement/bin/x86/Release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ui-snapshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: win7-book-management-offline-installer
          path: installer/output/Win7BookManagement-Offline-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish tagged release with SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and VERSION differ." }
          $installer = "installer/output/Win7BookManagement-Offline-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("installer/output/SHA256SUMS", "$hash  Win7BookManagement-Offline-Setup.exe`n")
          $signed = if ($env:BOOKDESK_SIGNING_CERT) { "Signed build." } else { "UNSIGNED build: verify SHA256SUMS; configure a code-signing certificate before commercial distribution." }
          gh release create $env:GITHUB_REF_NAME $installer "installer/output/SHA256SUMS" --title "BOOK DESK v$version" --notes "Windows 7 SP1 / .NET Framework 4.8 / x86. $signed See CHANGELOG.md and docs/WIN7_SMOKE_TEST.md. CI is not a substitute for the documented physical Win7 acceptance run."
        env:
          GH_TOKEN: ${{ github.token }}
          BOOKDESK_SIGNING_CERT: ${{ secrets.BOOKDESK_SIGNING_CERT }}
