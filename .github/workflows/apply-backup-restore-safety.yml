name: apply-backup-restore-safety

on:
  push:
    branches: [ fix/backup-restore-safety ]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply documentation and restore round-trip tests
        shell: powershell
        run: |
          # Apply the verified source-table fix together with docs and round-trip coverage.
          python .\scripts\apply_backup_restore_safety_tests.py
          Remove-Item ".\scripts\apply_backup_restore_safety_tests.py"
          Remove-Item ".github\workflows\apply-backup-restore-safety.yml"

      - name: Validate C# source manifest
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\validate-csproj-sources.ps1"

      - name: Restore packages
        run: msbuild Win7BookManagement.sln /t:Restore /p:Configuration=Release /p:Platform=x86

      - name: Build Debug x86
        run: msbuild Win7BookManagement.sln /m /p:Configuration=Debug /p:Platform=x86

      - name: Build Release x86
        run: msbuild Win7BookManagement.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Run self test including backup restore round trip
        shell: powershell
        run: |
          $exe = Resolve-Path "src\Win7BookManagement\bin\x86\Release\Win7BookManagement.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path (Split-Path $exe) "self-test-error.txt"
            if (Test-Path $errorFile) { Get-Content $errorFile | Write-Host }
            throw "Self test failed with exit code $($process.ExitCode)"
          }

      - name: Commit verified changes
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify backup restore round trip and document safety rules"
          git push origin HEAD:fix/backup-restore-safety
